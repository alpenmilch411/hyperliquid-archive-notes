[project]
name = "hyperliquid-archive-notes"
version = "0.1.0"
description = "A correct reader for Hyperliquid's historical market-data archive, and the evidence for why a naive one is wrong."
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "lz4>=4.4.5",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
